# Standalone repo entry (ATT-IT-Cloud-Services/plesk-ts-sdk) — build, publish, release.
name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Smoke
        run: node scripts/smoke-models.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: plesk-ts-sdk-dist
          path: dist
          retention-days: 14

  publish:
    name: Publish GitHub Package
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://npm.pkg.github.com
          scope: "@att-it-cloud-services"

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: plesk-ts-sdk-dist
          path: dist

      - name: Set unique publish version
        run: |
          BASE=$(node -p "require('./package.json').version.split('-')[0]")
          VERSION="${BASE}-${{ github.run_id }}"
          npm pkg set "name=@att-it-cloud-services/plesk-ts-sdk"
          npm pkg set "version=${VERSION}"
          echo "Publishing @att-it-cloud-services/plesk-ts-sdk@${VERSION}"

      - name: Publish to GitHub Packages
        run: npm publish --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Publish GitHub release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: plesk-ts-sdk-dist
          path: dist

      - name: Resolve version
        id: meta
        run: |
          VERSION="$(node -p "require('./package.json').version.replace(/^v/i, '')")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Prepare release files
        run: bash scripts/prepare-release-assets.sh "$PWD" "$GITHUB_WORKSPACE/release-upload"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "plesk-ts-sdk ${{ steps.meta.outputs.version }} (build ${{ github.run_number }})"
          generate_release_notes: true
          make_latest: true
          overwrite_files: true
          fail_on_unmatched_files: false
          body: |
            Automatischer Release des **Plesk TypeScript SDK**.

            | Datei | Inhalt |
            |---|---|
            | `plesk-ts-sdk-*.tgz` | npm-Paket (`npm install ./plesk-ts-sdk-*.tgz`) |
            | `plesk-ts-sdk-*-dist.zip` | Kompiliertes `dist/`, README und Lizenz |

            Zusätzlich als GitHub Package `@att-it-cloud-services/plesk-ts-sdk` veröffentlicht.
          files: release-upload/*
